<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <!--
    The hex of the logo without the wordmark, for the navigation bar, where
    it is drawn at about 30 pixels high. It is still, on purpose. The bar is
    on every page, and a picture that moves there would take the eye from
    the text. The paths and the colours are those of bones-hex.svg in
    pkgdown/logo/. The bone and the lines are centred in the hex, and the
    border is one unit thicker, so that it holds at this size. The wave is
    the teal band of the logo, stopped where the logo has it.
  -->
  <defs>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="82" y2="0">
      <stop offset="0"    stop-color="#B9B2A3"/>
      <stop offset="0.42" stop-color="#B9B2A3"/>
      <stop offset="0.55" stop-color="#237A80"/>
      <stop offset="0.68" stop-color="#B9B2A3"/>
      <stop offset="1"    stop-color="#B9B2A3"/>
    </linearGradient>
  </defs>
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#F4EFE4" stroke="#17202A" stroke-width="4" stroke-linejoin="round"/>
  <g transform="translate(50 58) scale(1.15) translate(-50 -49.75)">
    <g fill="#17202A">
      <rect x="31" y="32" width="38" height="12" rx="3"/>
      <circle cx="30" cy="32.5" r="7"/>
      <circle cx="30" cy="43.5" r="7"/>
      <circle cx="70" cy="32.5" r="7"/>
      <circle cx="70" cy="43.5" r="7"/>
    </g>
    <rect x="21" y="58" width="58" height="6" rx="3" fill="url(#wave)" opacity="0.85"/>
    <rect x="21" y="68" width="38" height="6" rx="3" fill="url(#wave)" opacity="0.7"/>
  </g>
</svg>
