<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <!--
    bones hex logo. An ink bone on bone, with a teal shimmer.

    The bone is the name of the package. Under it are two lines of a
    skeleton loader, the last one short so that they read as a paragraph.
    That is the shape that bones draws while content loads, so the mark
    says both the name and what the package does. The band of teal across
    the lines is the "wave" animation of bones, stopped at one moment.

    The bone is short and thick, with two round lobes at each end and a
    clear notch between them, so that it reads as a cartoon dog bone. A
    long, thin bone with separate knobs reads as something else.

    The hexagon is inset by 2 units. A stroke sits on the centre of its
    path, so a hexagon drawn to the edge of the viewBox would have half of
    its border cut off.

    The wordmark uses Poppins, the typeface of the documentation site. It
    is not installed as a system font, so build-logo.R renders this file in
    a headless browser that loads the site's own copy of the font.
  -->
  <defs>
    <!-- The wave: grey, a band of teal, grey again. userSpaceOnUse puts the
         band at the same place on each line, so it reads as one sweep of
         light across the card. -->
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="82" y2="0">
      <stop offset="0"    stop-color="#B9B2A3"/>
      <stop offset="0.42" stop-color="#B9B2A3"/>
      <stop offset="0.55" stop-color="#237A80"/>
      <stop offset="0.68" stop-color="#B9B2A3"/>
      <stop offset="1"    stop-color="#B9B2A3"/>
    </linearGradient>
  </defs>

  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#F4EFE4"/>
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="none"
        stroke="#17202A" stroke-width="3" stroke-linejoin="round"/>

  <!-- The bone: a thick shaft, and two round lobes at each end that overlap. -->
  <g fill="#17202A">
    <rect x="31" y="32" width="38" height="12" rx="3"/>
    <circle cx="30" cy="32.5" r="7"/>
    <circle cx="30" cy="43.5" r="7"/>
    <circle cx="70" cy="32.5" r="7"/>
    <circle cx="70" cy="43.5" r="7"/>
  </g>

  <!-- Two skeleton lines below the bone. The last one is short. -->
  <rect x="21" y="58" width="58" height="6" rx="3" fill="url(#wave)" opacity="0.85"/>
  <rect x="21" y="68" width="38" height="6" rx="3" fill="url(#wave)" opacity="0.7"/>

  <text x="50" y="96" text-anchor="middle" font-size="15" font-weight="500"
        fill="#17202A" font-family="Poppins, sans-serif">bones</text>
</svg>
