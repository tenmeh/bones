<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    The bare mark, for the favicons. It has no wordmark on purpose.

    pkgdown can make favicons from logo.png, but it would shrink the whole
    hexagon, text and all, into 16 pixels, and the result is unreadable.
    This square version keeps only the ink bone and one thick teal line,
    which stay clear at that size. build-logo.R makes every favicon from
    this file.

    The square has an ink border, so that the light square still shows on
    a light browser tab.
  -->
  <rect x="2" y="2" width="96" height="96" rx="18" fill="#F4EFE4"
        stroke="#17202A" stroke-width="4"/>
  <g fill="#17202A">
    <rect x="27" y="28" width="46" height="17" rx="4"/>
    <circle cx="26" cy="28.5" r="10"/>
    <circle cx="26" cy="44.5" r="10"/>
    <circle cx="74" cy="28.5" r="10"/>
    <circle cx="74" cy="44.5" r="10"/>
  </g>
  <rect x="17" y="66" width="66" height="12" rx="6" fill="#237A80"/>
</svg>
