url: https://tenmeh.github.io/bones/

template:
  bootstrap: 5
  light-switch: true
  default-theme: light
  bslib:
    # The site has the shapes of the blog of the author (tenmeh.github.io),
    # and the colours of the logo: the bone paper (#F4EFE4), the ink
    # (#17202A) and the teal (#237A80). In the light mode the ground is the
    # bone paper and the text is the ink. In the dark mode the ground is the
    # ink. Bootstrap makes its own tints and shades from these values, so
    # they are set here and not only in extra.css, which holds the same
    # values in its tokens. Change both places together.
    bg: "#f4efe4"
    fg: "#17202a"
    body-bg-dark: "#17202a"
    body-color-dark: "#ece5d6"
    border-color: "#ddd4c2"
    border-color-dark: "#2c3844"
    # The teal of the logo is 4.4:1 on the paper, and WCAG AA asks for
    # 4.5:1. The glows of the ground make it worse. The light mode thus uses
    # a darker teal of the same hue. It gives 6.9:1 on the paper, and 5.0:1
    # at the centre of the glows, where the ground is at its most teal.
    # extra.css lists the contrast of each colour.
    #
    # The dark mode does not derive its link colour from this one. Bootstrap
    # would lighten it by 40%, which gives a dusty grey-teal that looks
    # little like the logo. The logo teal itself is too dark to read on the
    # ink (3.3:1), so the dark mode takes a lighter teal of the same hue. It
    # gives 8.0:1 on the ink.
    primary: "#145a5f"
    link-color-dark: "#5cc4ca"
    # Geist for the text and the headings, and Geist Mono for the code, as on
    # the blog. bslib downloads the files from Google Fonts when the site is
    # built, and the site serves them itself. A visitor thus makes no request
    # to Google.
    base_font:
      google:
        family: "Geist"
        wght: "400..800"
    heading_font:
      google:
        family: "Geist"
        wght: "400..800"
    code_font:
      google:
        family: "Geist Mono"
        wght: "400..600"
    font-size-root: "17px"
    headings-font-weight: 600
    line-height-base: 1.72
    # The cards and the code blocks of the blog have round corners of about
    # 10 to 14px. Bootstrap uses this value for its own boxes.
    border-radius: "0.6rem"

  # The picture that Slack, LinkedIn, X and WhatsApp show when the address of
  # the site is shared. Without it pkgdown uses the logo, which is a small
  # hex and looks lost in a wide preview. The files are in pkgdown/assets, so
  # they are copied to the root of the site, and a relative src is made
  # absolute with the url above. pkgdown allows one image only, and it is the
  # GIF: Slack and Discord play it, so the hex moves in the preview. Frame 0
  # of the GIF is the still card.png, so LinkedIn, X, WhatsApp and iMessage,
  # which do not animate, show that. card.png is kept in the repository as the
  # still, and as the source of truth if the GIF is made again. Both are made
  # by scripts/site-card in the repository of the blog (tenmeh.github.io).
  # Make them again there if the tagline below, or the look of the site,
  # changes.
  opengraph:
    image:
      src: card.gif
      alt: "The word bones in large letters with the tagline Content-shaped loading placeholders for Shiny, beside the teal bones hex logo, with skeleton bars that fill in, a bar chart and dots around it."

  # X shows the large picture only when the page says so with twitter:card.
  # pkgdown can write that tag from "opengraph: twitter:", but it then
  # refuses to build unless the block also names a "creator" or a "site", and
  # that is an account on X, which this package does not have. So the tag is
  # written here by hand. If an account is added later, move this into
  # "opengraph: twitter: card:" with the "creator". The description is
  # written here also, the same text as home: description below, so that a
  # preview has a line of text under the title on every page.
  includes:
    in_header: |
      <meta name="twitter:card" content="summary_large_image">
      <meta property="og:description" content="Replaces loading spinners with skeleton placeholders in the shape of the content: bars for a bar chart, the controls of DT for a DT table.">
      <meta name="twitter:description" content="Replaces loading spinners with skeleton placeholders in the shape of the content: bars for a bar chart, the controls of DT for a DT table.">

home:
  title: Content-shaped loading placeholders for Shiny
  description: >
    Replaces loading spinners with skeleton placeholders in the shape of the
    content: bars for a bar chart, the controls of DT for a DT table.
  sidebar:
    # The built-in "dev" component holds the badges. pkgdown gives it the
    # heading "Dev status". This structure leaves "dev" out and uses the
    # "status" component below in its place, as in rewind.
    #
    # The badges appear here and in the README. Change both places together.
    structure: [status, links, license, citation, authors]
    components:
      status:
        title: Status
        text: |
          [![R-CMD-check](https://github.com/tenmeh/bones/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/tenmeh/bones/actions/workflows/R-CMD-check.yaml)

navbar:
  structure:
    left: [intro, shapes, demo, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/get-started.html
    shapes:
      text: Shapes
      href: articles/shapes.html
    demo:
      text: Live demo
      href: articles/live-demo.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github fa-lg
      href: https://github.com/tenmeh/bones
      aria-label: GitHub repository

reference:
  - title: Wrap an output
    desc: >
      The one call that most applications need. It finds the shape from the
      output, keeps the space of the content, and shows the old content,
      dimmed, when the output calculates again. bones_auto() does this for
      every output in a UI.
    contents:
      - withBones
      - bones_auto

  - title: Your own placeholder
    desc: >
      The block to build a placeholder of your own, for withBones(skeleton = ).
    contents:
      - bones_block

  - title: Error states
    desc: A calm panel for a failed output.
    contents:
      - bones_fallback

  - title: Placeholders on their own
    desc: >
      A skeleton where there is no Shiny output, such as inside a
      renderUI() while data loads.
    contents:
      - bones_skeleton

  - title: Look and feel
    desc: Colours, corner radius, animation and speed, for the whole session.
    contents:
      - bones_defaults

  - title: Assets
    desc: The stylesheet and the script, for HTML that you make yourself.
    contents:
      - bones_dependency

  - title: Package
    contents:
      - bones-package
