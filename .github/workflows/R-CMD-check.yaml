# R CMD check on several systems, at CRAN standards.
#
# The matrix uses the same systems as CRAN. A successful run here is thus
# good evidence that CRAN will accept a submission.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # R-devel changes often, and a break there is not always ours. It reports
    # a failure, but it does not stop a merge or turn main red.
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The "New submission" note and the unreachable-URL note occur only
      # against the live CRAN index. They would fail each run. Do the real
      # CRAN incoming check at submission time, with
      # devtools::check(remote = TRUE).
      _R_CHECK_CRAN_INCOMING_: false
      # Run the tests that call skip_on_cran(), as a developer would.
      NOT_CRAN: true
      # The browser tests run in the "browser tests" job below, on one
      # system. A headless browser on a slow runner can time out for reasons
      # that have no relation to the package. Such a timeout must not fail
      # the check of the package on five systems.
      BONES_BROWSER_TESTS: false

    steps:
      - uses: actions/checkout@v4

      # There is no setup-pandoc step here, and this is intentional. pandoc
      # stops only one NOTE: the check of README.md and NEWS.md. That check
      # is part of the CRAN incoming set that the variable above disables.
      # The result is thus Status OK with no pandoc.
      #
      # A setup-pandoc step made each run depend on a download from a GitHub
      # release. That download returns 503 errors frequently. The build then
      # failed for a reason with no relation to the package. The package has
      # no vignettes, so no other step needs pandoc.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # CRAN accepts no NOTEs. This check thus accepts none.
          error-on: '"note"'
          upload-snapshots: true

  browser:
    # The shinytest2 tests: the real apps in a headless Chrome. One system is
    # enough, because the browser is the same Chrome on each system.
    runs-on: ubuntu-latest
    name: browser tests

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Run the tests, with the browser tests
        shell: Rscript {0}
        run: |
          testthat::test_local(
            reporter = testthat::ProgressReporter$new(show_praise = FALSE),
            stop_on_failure = TRUE
          )
